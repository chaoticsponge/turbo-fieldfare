name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The runner's default Xcode is the newest on the image, so this job alone
  # never exercised the oldest toolchain the README supports. Three Swift 6.2
  # build breaks shipped in 0.5.0 behind that gap.
  build-oldest-supported-toolchain:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Select the oldest supported Xcode
        run: |
          app=$(ls -d /Applications/Xcode_26.3*.app 2>/dev/null | head -1)
          if [ -z "$app" ]; then
            echo "Xcode 26.3 is not on this runner image; available:" >&2
            ls -d /Applications/Xcode*.app >&2
            exit 1
          fi
          sudo xcode-select -s "$app"
      - name: Report the toolchain
        run: swift --version
      - name: Build release products
        run: swift build -c release

  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Report the toolchain
        run: swift --version
      - name: Build release products
        run: swift build -c release
      - name: Run serial tests
        run: |
          set -o pipefail
          Scripts/test.sh 2>&1 | tee /tmp/swift-tests.log
          python3 - <<'PYTHON'
          import re
          from pathlib import Path
          assert re.search(r"Test run with [1-9][0-9]* tests? .*passed", Path('/tmp/swift-tests.log').read_text()), "No successful nonempty Swift test run"
          PYTHON
      - name: Check for tracked symlinks
        run: ruby Scripts/check_tracked_symlinks.rb
      - name: Check Markdown links
        run: ruby Scripts/check_markdown_links.rb
      - name: Check the app version against the latest release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ruby Scripts/check_app_version.rb

  agent-security:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.12.6"
      - name: Install locked local-agent dependencies
        run: bash Scripts/setup-qwen-agents.sh
      - name: Test agent admission and HTTP defenses
        run: bash Scripts/test.sh --qwen-agents
      - name: Test synthetic expert streaming when Metal is available
        run: |
          if .build/qwen-agent-venv/bin/python -c 'import mlx.core as mx; raise SystemExit(0 if mx.metal.is_available() else 1)'; then
            bash Scripts/test.sh --expert-streaming
          else
            echo "::warning::Metal unavailable on this runner; synthetic MLX tests require an Apple Silicon GPU host."
          fi
